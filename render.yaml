services:
  - type: web
    name: student-course-enrollment
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-course-enrollment-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: student-course-enrollment-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-course-enrollment-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: student-course-enrollment-db
    databaseName: student_course_db
    user: student_course_user
    region: singapore
    plan: free
